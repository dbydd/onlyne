# Onlyne v1.0.0 example spec: the single central truth of one server root.
# Copy this file to <server-root>/.onlyne/spec.toml.
# Replace every ed25519/REPLACE_ME value with the output of `onlyne-client init` and every
# sha256/REPLACE_ME value with the SPKI fingerprint printed by `onlyne-server init`.
# A key no field declares is ignored: the file still loads, and each ignored key gets one
# `ignoring unknown key` warning line in the log of the process that read it. A real key holding a
# wrong value still refuses the start with `spec.toml:<line>: <message>`.
#
# Loading semantics (docs/v1-PLAN.md §5 line 270):
# 1. `onlyne-server run` parses the whole file at startup. A type error or a missing required key
#    refuses the start and prints `spec.toml:<line>: <message>`. An unrecognized key is skipped and
#    named in the log.
# 2. `onlyne reload` (spelled `onlyne server reload` in the server group) and SIGHUP reparse the file
#    into a temporary structure, validate it, then swap atomically. A failed validation keeps the
#    running spec and records fault{kind:"spec_reload_failed"}. The reload answer carries the applied
#    change through SpecDiff::render.
# 3. No runtime op writes this file. `onlyne-client init` and `onlyne server generate` print a
#    `[[client]]` fragment on stdout for an operator to append, then `onlyne reload` applies it.

# docs/v1-PLAN.md §5 line 221
[server]
# name is the cluster's identity, the single key behind both placeholder spellings: {{cluster}} and {{server_name}} in a template both resolve from this value (crates/onlyne-config/src/template.rs Placeholders carries the two names). Read by onlyne-server at startup, in the handshake, and by the generate driver. Default: empty string, refused at startup.
name = "cluster-a"
# listen sets the server TCP bind address. Read by onlyne-server listeners and by the generate driver for {{listen}}. Default: empty string, refused at startup.
listen = "127.0.0.1:7811"
# cert_pin pins the server certificate SPKI SHA-256 fingerprint printed by `onlyne-server init`. Read by every role client during handshake verification. Default: empty string, refused at startup.
cert_pin = "sha256/REPLACE_ME"
# note_queue toggles queueing for a note its role cannot take now: offline, or online with no session running. Read by the onlyne-server router before the ledger write. Default: false, which refuses the delivery.
note_queue = false
# fault_history_days sets fault record retention. Read by onlyne-server fault pruning. Default: 14.
fault_history_days = 14
# resync_lag sets the event lag that makes a client resubscribe. Read by the client runloop while it tracks server_seq. Default: 256.
resync_lag = 256
# heartbeat_timeout_ms sets the presence liveness timeout. Read by onlyne-server presence tracking. Default: 30000.
heartbeat_timeout_ms = 30000
# stale_watch_secs sets the server stale-watch scan interval. Read by onlyne-server at startup; 0 disables the watch. Default: 60.
stale_watch_secs = 60
# heartbeat_grace_secs sets how long a working session may go without a heartbeat while its role link stays online before the server records a heartbeat_missing fault. Read by the onlyne-server stale watch. Default: 90.
heartbeat_grace_secs = 90
# ghost_sweep_secs sets the ghost sweep scan interval. One pass settles a working session row whose own task ledger row already reached a terminal state, writes the verdict that row carries, and records the write in the ghost_sweeps audit table. Read by onlyne-server at startup; 0 disables the sweep. Default: 60.
ghost_sweep_secs = 60
# requeue_max_attempts caps the automatic re-deliveries one in_flight row may take before it lands rejected with reason requeue_exhausted. Read by the onlyne-server requeue path at hello adoption, link teardown, and the exited-session release; repair verbs ride outside the gate. Default: 0, which keeps the budget unlimited.
requeue_max_attempts = 0
# requeue_ttl_secs bounds the age, counted from enqueue, at which an automatic re-delivery attempt expires the row with reason requeue_ttl instead of requeueing. Read by the same requeue path. Default: 0, which disables the deadline.
requeue_ttl_secs = 0
# agent_package holds the absolute local path of an external coding-agent package. Read by the generate driver once, which vendors a copy and renders {{agent_package}} as `.onlyne/agent/<pkg-name>`. Default: empty string, and a template that uses {{agent_package}} then exits 4.
agent_package = ""
# template_root sets the template source root under the server root. Read by the generate driver during template discovery. Default: .onlyne/templates.
template_root = ".onlyne/templates"

# [[hook]] carries operator policy in the same file the core reads: the event classes to watch,
# the command to spawn, and the bound on one run. A hook fires when the server persists a matching
# event and never delays the delivery path (docs/v2-CONTRACT.md §"Slice 7").
# docs/v2-PLAN.md §"事件钩子".
[[hook]]
# on lists the classes this hook fires for, each from a closed set: ledger_state, session_state, fault, role_presence, gateway_presence, spec_reloaded, turn_end_without_complete, delivery_blocked, handoff. A class outside that set refuses the load by name, with `spec.toml:<line>`. The last three are the client's own witness of an ending and reach the stream through its publish_event verb. Read by the onlyne-server hook workers, whose set is read at startup.
on = ["delivery_blocked", "turn_end_without_complete"]
# run holds the argv one matching event spawns. The event arrives as one JSON object on stdin — seq, type, data, created_at — and ONLYNE_SOCKET names the admin socket, so the script acts with the same `onlyne` binary. An empty argv is refused per entry.
run = ["./hooks/notify-supervisor.sh"]
# timeout is one whole number with an ms, s, or m suffix, and it is required per entry. A run that exits nonzero or passes this bound records fault hook_failed once for that event, which itself stays untouched; the hook comes back to that event on its next pass rather than stepping over it. A value that does not parse is refused with its line.
timeout = "10s"

# docs/v1-PLAN.md §5 line 232
[[client]]
# role names this role, the unit of addressing and ACL keying. Read by the server router, the ACL decision, and the generate driver. Default: empty string, refused per entry.
role = "planner"
# key holds the role ed25519 public key. Read by the handshake verifier. Default: empty string, refused per entry.
key = "ed25519/REPLACE_ME"
# prose holds the central role prompt, the single source for this role. Read by the role client through `welcome` and cached into client.db. Default: empty string.
prose = """Read the incoming task, produce a concise completion reply, and hand the result back through the session command. Cite the task id in every message."""
# admin marks admin privilege for this role. Read by the admin socket authorization path. Default: false.
admin = true
# max_sessions caps concurrent sessions for this role. Read by client dispatch and server projection. Default: 1.
max_sessions = 3
# allowed_senders lists roles allowed to deliver to this role. Read by acl_allows before the ledger write. Default: empty list, which denies every sender. ["*"] admits every registered role. A role named `_supervisor` delivers with no entry here: that sender reads no receiver list.
allowed_senders = ["*"]
# allowed_targets lists roles this role may reach. Read by acl_allows before the ledger write. Default: empty list, which denies every target. ["*"] admits every registered role. On the entry of a role named `_supervisor` this list is the only gate: an empty one reaches every registered role, and a non-empty one names the reachable roles exactly.
allowed_targets = ["builder", "reviewer", "_supervisor"]
# owes_targets lists the roles a session of this role owes a delivery to before it may report a terminal outcome: the completion guard refuses while any name on it has not received a delivery from that session. Reach is permission and never compels one, so the obligation is its own declaration. Default: empty list, which owes nothing. Every name must be reachable through allowed_targets, through "*", or as the role's own name — the loader refuses an obligation the ACL could never satisfy.
owes_targets = ["builder"]
# aggregate marks this role as the representative of an external cluster. Read by the server and the generate driver as an annotation. Default: empty string, which marks a local role.
aggregate = ""
# reconnect_grace_secs is not a key of this file. The window a dropped plugin connection may stay away before its role client retires the task-free session it left behind is read from that role's own workspace `.onlyne/config.toml` (Default: 60 seconds; 0 disables the sweep). A key this schema does not know is warned about and ignored, so a line here would start the server and quietly do nothing; a wrong value on a real key refuses the start; and the keys v2 retired by name (`backend`, `relay_required`, `relay_required_count`, `relay_count`) are refused by name with BACKEND_IS_GONE or RELAY_IS_GONE.

# docs/v1-PLAN.md §5 line 242
[client.timeout]
# ready_ms bounds startup readiness for one session. The server projects it into the hello reply. Default: 30000.
ready_ms = 30000
# idle_ms bounds one idle session. The server projects it into the hello reply. Default: 60000.
idle_ms = 60000

# docs/v1-PLAN.md §5 line 243
[client.intent]
# attempts sets the retry count for one coding-agent response. Read by the client intent runner. Default: 3.
attempts = 3
# backoff_ms sets retry delays in order. Read by the client intent runner. Default: [1000, 2000, 4000].
backoff_ms = [1000, 2000, 4000]

# [client.runtime] is the drive and the argv one session runs: drive = "plugin" (the default),
# "acp" (placement = "headless" only), or "exec"; {session} and {task} are substituted.
[client.runtime]
drive = "plugin"
command = ["pi", "--session-id", "{session}"]

