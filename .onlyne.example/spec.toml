# docs/v1-PLAN.md §5 line 252
[[gateway]]
# id names this gateway attachment. Read by gateway host registration and by route matching. Default: empty string, refused per entry.
id = "tg1"
# platform selects the platform plugin of the gateway host. Read by the gateway host at startup. Default: empty string, refused per entry.
platform = "telegram"
# key holds the gateway ed25519 public key. Read by the handshake verifier. Default: empty string, refused per entry.
key = "ed25519/REPLACE_ME"
# enabled toggles the attachment. Read by the gateway host at startup and by the server registry. Default: false.
enabled = true

# Routes are matched in file order against one inbound message, and the first match wins. The
# exact conversation match below therefore sits above the fallback entry.
# docs/v1-PLAN.md §5 line 258, and docs/v1-PLAN.md §5 line 267 for the first-match rule.
[[route]]
# gateway selects the inbound gateway id. Read by server inbound matching in file order. Default: empty string, refused per entry.
gateway = "tg1"
# channel selects the platform channel of the inbound message. Read by server inbound matching in file order. Default: empty string, refused per entry.
channel = "telegram"
# conversation selects one external conversation. Read by server inbound matching, where absent means every conversation of that gateway. Default: absent, which makes this entry the fallback.
conversation = "1234"
# to names the delivery target. to.role carries the role name, to.session pins one session, and absent to.session is the default. Read by server inbound matching.
to = { role = "planner" }

# docs/v1-PLAN.md §5 line 264
[[route]]
# gateway selects the inbound gateway id. Read by server inbound matching in file order. Default: empty string, refused per entry.
gateway = "tg1"
# channel selects the platform channel of the inbound message. Read by server inbound matching in file order. Default: empty string, refused per entry.
channel = "telegram"
# conversation is omitted here, so this entry catches every conversation of this gateway that no earlier entry claimed.
# to names the delivery target. to.role carries the role name, to.session pins one session, and absent to.session is the default. Read by server inbound matching.
to = { role = "_supervisor" }
