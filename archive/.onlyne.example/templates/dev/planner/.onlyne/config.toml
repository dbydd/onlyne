# templates/dev/planner/ for role planner in topology dev.
# docs/v1-PLAN.md §11 line 374: generate merges this fragment with the values derived from spec.toml,
# and the derived document wins on every overlapping key. Only keys that need a local decision belong
# here, such as the local plugin list.
plugins = ["pi-onlyne"]
