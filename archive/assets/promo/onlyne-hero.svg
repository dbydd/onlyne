    <line x1="312" y1="146" x2="236" y2="174" stroke="#33D6EE" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <line x1="272" y1="280" x2="222" y2="212" stroke="#8FA3C2" stroke-opacity="0.28" stroke-dasharray="4 4"/>
