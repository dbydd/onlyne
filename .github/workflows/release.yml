name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.3.1. Leave empty to build the pushed tag."
        required: false
        type: string

permissions:
  contents: write

env:
  # The five binaries a release ships. `onlyne` is the thin CLI entrypoint that
  # forwards to the three daemons; `onlyne-tui` is the operator's read-only view;
  # `onlyne-gateway` carries all four platform plugins behind its default
  # features, which is why every job below needs protoc (openlark builds prost).
  BINS: onlyne onlyne-server onlyne-client onlyne-gateway onlyne-tui

jobs:
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A tag that does not name the workspace version is a release nobody can
      # reproduce from the source, so it fails here rather than at install time.
      - name: tag matches the workspace version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="v$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          if [ "$tag" != "$want" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $want"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_ext: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_ext: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: protoc (unix)
        if: runner.os != 'Windows'
        run: |
          if command -v brew >/dev/null; then brew install protobuf; else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler; fi
      - name: protoc (windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y
      - name: build
        shell: bash
        run: |
          for bin in $BINS; do
            cargo build --release --locked --target ${{ matrix.target }} --bin "$bin"
          done
      - name: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          root="onlyne-$version-${{ matrix.target }}"
          mkdir -p "stage/$root"
          for bin in $BINS; do
            if [ "${{ runner.os }}" = "Windows" ]; then cp "target/${{ matrix.target }}/release/$bin.exe" "stage/$root/";
            else cp "target/${{ matrix.target }}/release/$bin" "stage/$root/"; fi
          done
          cp LICENSE "stage/$root/"
          # The CLI emits its own completions, so the archive ships what the
          # operator's shell actually reads rather than a hand-written script.
          cli="target/${{ matrix.target }}/release/onlyne"
          if [ "${{ runner.os }}" = "Windows" ]; then cli="$cli.exe"; fi
          for shell in bash zsh fish; do
            "$cli" completions "$shell" > "stage/$root/onlyne.$shell"
          done
          (cd stage && tar -czf "../onlyne-$version-${{ matrix.target }}.tar.gz" "$root")
          # Git Bash has no `zip`, and PowerShell's archiver is on every Windows
          # runner, so the Windows archive is written there.
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'stage/$root' -DestinationPath 'onlyne-$version-${{ matrix.target }}.zip' -Force"
          else
            (cd stage && zip -qr "../onlyne-$version-${{ matrix.target }}.zip" "$root")
          fi
      - name: checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"; version="${version#v}"
          archive="onlyne-$version-${{ matrix.target }}.${{ matrix.asset_ext }}"
          # macOS ships `shasum`; the Linux and Windows runners ship `sha256sum`.
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            digest=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$digest" "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            onlyne-*.${{ matrix.asset_ext }}
            onlyne-*.${{ matrix.asset_ext }}.sha256
          if-no-files-found: error

  release:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - name: tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
          # A tag that was deleted and pushed again leaves its release a draft, and a
          # draft serves no asset URL. The step ends on a published release either way.
          gh release edit "$TAG" --draft=false
      - name: notes
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/install.sh | sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  formula:
    name: formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The per-archive `.sha256` files are the artifacts; the combined list is
      # assembled here the same way the publish job assembles it, because an
      # artifact does not travel between jobs.
      - name: collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - name: render
        run: |
          python3 scripts/render-formula.py \
            --version "${TAG#v}" \
            --repository "${{ github.repository }}" \
            --checksums dist/SHA256SUMS \
            --output packaging/homebrew/onlyne.rb
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/homebrew/onlyne.rb
          git diff --cached --quiet || git commit -m "packaging: the release formula for ${TAG}"
          git push origin HEAD:main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
