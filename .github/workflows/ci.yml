name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (openlark prost build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (openlark prost build)
        run: choco install protoc -y
      - name: Workspace tests
        shell: bash
        run: cargo test --no-fail-fast -p onlyne-proto -p onlyne-frame -p onlyne-config -p onlyne-layout -p onlyne-store -p onlyne-session -p onlyne-net -p onlyne-adapter -p onlyne-server -p onlyne-client -p onlyne-gateway -p onlyne-cli -p onlyne-tui
