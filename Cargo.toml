[workspace]
resolver = "2"
# `plugins/` holds only `onlyne-agent-pi`, a pure-Node package with no
# Cargo.toml, so the member glob stays inside `crates/`.
members = ["crates/*"]
# The optional graphical front end builds its own dependency tree (axum, and a
# Node-made bundle behind `rust-embed`), so it stays out of the workspace: the
# core build — `cargo build` and `cargo build --workspace` alike — never needs
# Node or axum, and `cargo build -p onlyne-web` inside `crates/onlyne-web` is
# the step that does (`docs/v2-PLAN.md` line 399).
exclude = ["crates/onlyne-web"]
default-members = [
  "crates/onlyne-wire",
  "crates/onlyne-proto",
  "crates/onlyne-config",
  "crates/onlyne-store",
  "crates/onlyne-acp",
  "crates/onlyne-net",
  "crates/onlyne-adapter",
  "crates/onlyne-server",
  "crates/onlyne-client",
  "crates/onlyne-cli",
  "crates/onlyne-testkit",
  "crates/onlyne-im-backend",
  "crates/onlyne-im",
  "crates/onlyne-im-backend-telegram",
  "crates/onlyne-im-backend-feishu",
  "crates/onlyne-im-backend-qqbot",
  "crates/onlyne-im-backend-slack",
  "crates/onlyne-im-backend-linear",
  "crates/onlyne-im-backend-fake",
]

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["dbydd <1992003927@qq.com>"]
repository = "https://github.com/dbydd/onlyne"
homepage = "https://github.com/dbydd/onlyne"


[workspace.dependencies]
# internal
onlyne-wire = { path = "crates/onlyne-wire", version = "2.3.0" }
onlyne-proto = { path = "crates/onlyne-proto", version = "2.3.0" }
onlyne-config = { path = "crates/onlyne-config", version = "2.3.0" }
onlyne-store = { path = "crates/onlyne-store", version = "2.3.0" }
onlyne-net = { path = "crates/onlyne-net", version = "2.3.0" }
onlyne-adapter = { path = "crates/onlyne-adapter", version = "2.3.0" }
onlyne-server = { path = "crates/onlyne-server", version = "2.3.0" }
onlyne-client = { path = "crates/onlyne-client", version = "2.3.0" }
onlyne-testkit = { path = "crates/onlyne-testkit", version = "2.3.0" }

onlyne-im-backend = { path = "crates/onlyne-im-backend", version = "2.3.0" }
onlyne-im = { path = "crates/onlyne-im", version = "2.3.0" }
onlyne-im-backend-telegram = { path = "crates/onlyne-im-backend-telegram", version = "2.3.0" }
onlyne-im-backend-feishu = { path = "crates/onlyne-im-backend-feishu", version = "2.3.0" }
onlyne-im-backend-qqbot = { path = "crates/onlyne-im-backend-qqbot", version = "2.3.0" }
onlyne-im-backend-slack = { path = "crates/onlyne-im-backend-slack", version = "2.3.0" }
onlyne-im-backend-linear = { path = "crates/onlyne-im-backend-linear", version = "2.3.0" }

# external
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
openlark = { version = "0.21.0", default-features = false, features = ["websocket"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
interprocess = { version = "2.4.4", features = ["tokio"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "fs",
  "process",
  "sync",
  "time",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The QQ Open Platform and Slack backends use websockets, so both compile this.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
# The editor behind `AdminOp::SpecApply`: a typed edit lands in the document
# as text, so an operator's comments and formatting survive it.
toml_edit = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
# `slack-morphism` re-exports none of its `url` type, and the connector trait it
# asks a caller to implement names it in every signature.
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
