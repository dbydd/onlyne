[workspace]
resolver = "2"
# `plugins/*` is a glob for the Rust gateway crates only; `onlyne-agent-pi` is a
# pure-Node package with no Cargo.toml, so the pattern must not reach it.
members = ["crates/*", "plugins/onlyne-gateway-*"]
default-members = [
  "crates/onlyne-frame",
  "crates/onlyne-proto",
  "crates/onlyne-config",
  "crates/onlyne-layout",
  "crates/onlyne-store",
  "crates/onlyne-session",
  "crates/onlyne-net",
  "crates/onlyne-adapter",
  "crates/onlyne-server",
  "crates/onlyne-client",
  "crates/onlyne-gateway",
  "crates/onlyne-cli",
  "crates/onlyne-tui",
  "crates/onlyne-testkit",
  "plugins/onlyne-gateway-telegram",
  "plugins/onlyne-gateway-feishu",
  "plugins/onlyne-gateway-qqbot",
  "plugins/onlyne-gateway-weixin",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["dbydd <1992003927@qq.com>"]
repository = "https://github.com/dbydd/onlyne"
homepage = "https://github.com/dbydd/onlyne"
publish = false

[workspace.dependencies]
# internal
onlyne-frame = { path = "crates/onlyne-frame", version = "1.0.0" }
onlyne-proto = { path = "crates/onlyne-proto", version = "1.0.0" }
onlyne-config = { path = "crates/onlyne-config", version = "1.0.0" }
onlyne-layout = { path = "crates/onlyne-layout", version = "1.0.0" }
onlyne-store = { path = "crates/onlyne-store", version = "1.0.0" }
onlyne-session = { path = "crates/onlyne-session", version = "1.0.0" }
onlyne-net = { path = "crates/onlyne-net", version = "1.0.0" }
onlyne-adapter = { path = "crates/onlyne-adapter", version = "1.0.0" }
onlyne-server = { path = "crates/onlyne-server", version = "1.0.0" }
onlyne-client = { path = "crates/onlyne-client", version = "1.0.0" }
onlyne-testkit = { path = "crates/onlyne-testkit", version = "1.0.0" }

# external
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "fs",
  "process",
  "sync",
  "time",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

# platform SDKs: gateway side only
openlark = { version = "0.17.0", default-features = false, features = ["websocket"] }
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
wechat-ilink = "0.5.0"
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }

# rendering / media: gateway side only
pulldown-cmark = "0.12"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
unicode-display-width = "0.2"
aes-gcm = "0.10"
qrcode = { version = "0.14", default-features = false }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
