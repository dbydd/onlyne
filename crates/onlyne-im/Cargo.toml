[package]
name = "onlyne-im"
version = "2.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IM gateway core: the client that presents IM conversations as addressable roles and triggers operator scripts"

[[bin]]
name = "onlyne-im"
path = "src/main.rs"

[dependencies]
onlyne-proto = { path = "../onlyne-proto", version = "2.2.0" }
onlyne-wire = { path = "../onlyne-wire", version = "2.2.0" }
onlyne-net = { path = "../onlyne-net", version = "2.2.0" }
onlyne-config = { path = "../onlyne-config", version = "2.2.0" }
onlyne-im-backend = { path = "../onlyne-im-backend", version = "2.2.0" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }