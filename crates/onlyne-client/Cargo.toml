[package]
name = "onlyne-client"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne client: role runtime, dispatch, intent, adapter socket"

[dependencies]
onlyne-wire = { path = "../onlyne-wire", version = "2.0.0" }
onlyne-proto = { path = "../onlyne-proto", version = "2.0.0" }
onlyne-store = { path = "../onlyne-store", version = "2.0.0" }
onlyne-config = { path = "../onlyne-config", version = "2.0.0" }
interprocess = { workspace = true }
onlyne-acp = { path = "../onlyne-acp", version = "2.0.0" }
onlyne-adapter = { path = "../onlyne-adapter", version = "2.0.0" }
onlyne-net = { path = "../onlyne-net", version = "2.0.0" }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "process", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
tar = "0.4"
flate2 = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
onlyne-testkit = { path = "../onlyne-testkit", version = "2.0.0" }
tempfile = "3.0"
