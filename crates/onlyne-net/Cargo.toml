[package]
name = "onlyne-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne v1 transport, TLS identity, admission, and reconnect backoff"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "rand_core"] }
onlyne-frame = { path = "../onlyne-frame", version = "1.0.0" }
onlyne-proto = { path = "../onlyne-proto" }
rand = "0.8.6"
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
time = { version = "0.3.49", default-features = false, features = ["std", "formatting"] }
tokio = { version = "1.52.3", features = ["macros", "net", "io-util", "fs", "time", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
x509-parser = "0.16.0"

[dev-dependencies]
tempfile = "3.27.0"
