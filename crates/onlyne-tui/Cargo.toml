[package]
name = "onlyne-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne v1 admin-socket observation TUI"

[[bin]]
name = "onlyne-tui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
onlyne-frame = { workspace = true }
onlyne-proto = { workspace = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
onlyne-net = { workspace = true }
onlyne-server = { workspace = true }
tempfile = { workspace = true }
