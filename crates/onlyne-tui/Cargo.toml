[package]
name = "onlyne-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne v1 admin-socket observation TUI"

[[bin]]
name = "onlyne-tui"
path = "src/main.rs"

# The journal viewer: one ACP session, full screen, no admin socket needed. Same
# crate and same widgets as the board, because it reads the same content surface.
[[bin]]
name = "onlyne-view"
path = "src/view.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
onlyne-frame = { workspace = true }
onlyne-layout = { workspace = true }
onlyne-proto = { path = "../onlyne-proto", version = "1.1.1" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
onlyne-net = { workspace = true }
onlyne-server = { workspace = true }
tempfile = { workspace = true }
