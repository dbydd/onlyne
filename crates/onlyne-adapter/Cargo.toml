[package]
name = "onlyne-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne v1 adapter SDK"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
onlyne-frame = { path = "../onlyne-frame", version = "1.0.0" }
onlyne-proto = { path = "../onlyne-proto", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
