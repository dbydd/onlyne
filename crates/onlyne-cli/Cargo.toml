[package]
name = "onlyne-cli"
version = "2.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne human entrypoint: the daemons' CLI and the admin-socket observation board"

[[bin]]
name = "onlyne"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
onlyne-adapter = { workspace = true }
onlyne-wire = { workspace = true }
onlyne-proto = { workspace = true }
onlyne-config = { workspace = true }
onlyne-server = { workspace = true }
interprocess = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
