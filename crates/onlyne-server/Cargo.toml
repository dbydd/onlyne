[package]
name = "onlyne-server"
version = "2.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onlyne server: routing, ledger, gateway host, admin socket"

[dependencies]

async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
onlyne-adapter = { path = "../onlyne-adapter", version = "2.1.1" }
onlyne-config = { path = "../onlyne-config", version = "2.1.1" }
onlyne-wire = { path = "../onlyne-wire", version = "2.1.1" }
interprocess = { workspace = true }
onlyne-net = { path = "../onlyne-net", version = "2.1.1" }
onlyne-proto = { path = "../onlyne-proto", version = "2.1.1" }
onlyne-store = { path = "../onlyne-store", version = "2.1.1" }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
toml = "0.8"
toml_edit = { workspace = true }
tracing = "0.1"
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
