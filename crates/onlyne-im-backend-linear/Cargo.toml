[package]
name = "onlyne-im-backend-linear"
version = "2.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linear platform backend for the Onlyne IM gateway"

[[bin]]
name = "onlyne-im-backend-linear"
path = "src/main.rs"

[dependencies]
onlyne-im-backend = { path = "../onlyne-im-backend", version = "2.3.0" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# The SDK's own `rustls-tls` feature asks reqwest for a `webpki-roots` feature
# that reqwest 0.13.5 no longer has, so TLS comes from this crate's own reqwest
# instead (the same version line the SDK depends on). `rustls-no-provider`
# makes `onlyne_im_backend::install_crypto_provider` the one thing that names
# the provider, so this binary carries `ring` only and never `aws-lc-rs`.
linear-api = { version = "0.1", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[dev-dependencies]
tempfile = { workspace = true }
